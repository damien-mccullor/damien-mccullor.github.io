<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="280" fill="#111111"/>
  <rect x="0" y="0" width="600" height="3" fill="#FFD700"/>

  <!-- API endpoint diagram (center) -->
  <!-- Client box -->
  <rect x="60" y="90" width="90" height="50" rx="4" fill="#1E1E1E" stroke="#FFD700" stroke-width="1.5"/>
  <text x="105" y="111" fill="#FFD700" font-size="11" text-anchor="middle" font-family="Arial" font-weight="bold">Client</text>
  <text x="105" y="127" fill="#E0E0E0" font-size="11.5" text-anchor="middle" font-family="Arial">React / Postman</text>

  <!-- Arrows -->
  <line x1="150" y1="108" x2="205" y2="108" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="122" x2="150" y2="122" stroke="#AAAAAA" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="177" y="103" fill="#FFD700" font-size="11" text-anchor="middle" font-family="Arial">HTTP</text>
  <text x="177" y="138" fill="#E0E0E0" font-size="11" text-anchor="middle" font-family="Arial">JSON</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AAAAAA"/>
    </marker>
  </defs>

  <!-- Spring Boot API box -->
  <rect x="205" y="75" width="110" height="80" rx="4" fill="#1E1E1E" stroke="#FFD700" stroke-width="2"/>
  <rect x="205" y="75" width="110" height="20" rx="4" fill="#FFD700"/>
  <text x="260" y="89" fill="#111111" font-size="12" text-anchor="middle" font-family="Arial" font-weight="bold">Spring Boot API</text>
  <text x="260" y="113" fill="#E0E0E0" font-size="11.5" text-anchor="middle" font-family="Arial">Controllers</text>
  <text x="260" y="126" fill="#E0E0E0" font-size="11.5" text-anchor="middle" font-family="Arial">Services</text>
  <text x="260" y="139" fill="#E0E0E0" font-size="11.5" text-anchor="middle" font-family="Arial">Repositories</text>

  <!-- Arrow to DB -->
  <line x1="315" y1="115" x2="360" y2="115" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MySQL DB cylinder -->
  <ellipse cx="400" cy="100" rx="40" ry="10" fill="#1E1E1E" stroke="#FFD700" stroke-width="1.5"/>
  <rect x="360" y="100" width="80" height="40" fill="#1E1E1E" stroke="#FFD700" stroke-width="1.5"/>
  <ellipse cx="400" cy="140" rx="40" ry="10" fill="#1E1E1E" stroke="#FFD700" stroke-width="1.5"/>
  <text x="400" y="124" fill="#FFD700" font-size="10.5" text-anchor="middle" font-family="Arial" font-weight="bold">MySQL</text>
  <text x="400" y="136" fill="#E0E0E0" font-size="11" text-anchor="middle" font-family="Arial">9 tables</text>

  <!-- Security badge -->
  <rect x="180" y="175" width="140" height="28" rx="4" fill="#1a1a1a" stroke="#B8860B" stroke-width="1"/>
  <text x="250" y="187" fill="#B8860B" font-size="12" text-anchor="middle" font-family="Arial" font-weight="bold">&#x1F512; Parameterized SQL</text>
  <text x="250" y="198" fill="#E0E0E0" font-size="11" text-anchor="middle" font-family="Arial">SQL Injection Protection</text>

  <!-- TDD badge -->
  <rect x="60" y="175" width="100" height="28" rx="4" fill="#1a1a1a" stroke="#AAAAAA" stroke-width="1"/>
  <text x="110" y="187" fill="#E0E0E0" font-size="12" text-anchor="middle" font-family="Arial">TDD — JUnit 5</text>
  <text x="110" y="198" fill="#E0E0E0" font-size="11" text-anchor="middle" font-family="Arial">MockMvc · Postman</text>

  <!-- Thymeleaf badge -->
  <rect x="350" y="175" width="100" height="28" rx="4" fill="#1a1a1a" stroke="#AAAAAA" stroke-width="1"/>
  <text x="400" y="187" fill="#E0E0E0" font-size="12" text-anchor="middle" font-family="Arial">Back-Office UI</text>
  <text x="400" y="198" fill="#E0E0E0" font-size="11" text-anchor="middle" font-family="Arial">Thymeleaf Templates</text>

  <!-- Footer -->
  <rect x="0" y="248" width="600" height="32" fill="#1E1E1E"/>
  <text x="300" y="269" fill="#FFD700" font-size="15" text-anchor="middle" font-family="Arial" font-weight="bold">Rocket Food Delivery — Enterprise REST API</text>
</svg>
