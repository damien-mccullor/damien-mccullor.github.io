<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="280" fill="#111111"/>
  <rect x="0" y="0" width="600" height="3" fill="#FFD700"/>

  <!-- Phone outline -->
  <rect x="228" y="24" width="144" height="210" rx="14" fill="none" stroke="#FFD700" stroke-width="2.5"/>
  <rect x="241" y="44" width="118" height="168" fill="#1E1E1E"/>
  <circle cx="300" cy="222" r="7" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <rect x="278" y="28" width="44" height="6" rx="3" fill="#333333"/>

  <!-- App header bar -->
  <rect x="241" y="44" width="118" height="22" fill="#FFD700"/>
  <text x="300" y="59" fill="#111111" font-size="11" text-anchor="middle" font-family="Arial" font-weight="bold">ROCKET FOOD</text>

  <!-- Food item cards -->
  <rect x="247" y="72" width="106" height="30" rx="3" fill="#2a2a2a"/>
  <rect x="251" y="76" width="22" height="22" rx="2" fill="#B8860B" opacity="0.6"/>
  <rect x="279" y="79" width="50" height="5" rx="2" fill="#555555"/>
  <rect x="279" y="88" width="35" height="4" rx="2" fill="#444444"/>

  <rect x="247" y="108" width="106" height="30" rx="3" fill="#2a2a2a"/>
  <rect x="251" y="112" width="22" height="22" rx="2" fill="#B8860B" opacity="0.6"/>
  <rect x="279" y="115" width="44" height="5" rx="2" fill="#555555"/>
  <rect x="279" y="124" width="30" height="4" rx="2" fill="#444444"/>

  <!-- Order button -->
  <rect x="255" y="148" width="90" height="24" rx="4" fill="#FFD700"/>
  <text x="300" y="164" fill="#111111" font-size="11" text-anchor="middle" font-family="Arial" font-weight="bold">Place Order</text>

  <!-- Dual-role badge -->
  <rect x="247" y="180" width="50" height="16" rx="8" fill="#1a1a1a" stroke="#FFD700" stroke-width="1"/>
  <text x="272" y="191" fill="#FFD700" font-size="11" text-anchor="middle" font-family="Arial">Customer</text>
  <rect x="303" y="180" width="42" height="16" rx="8" fill="#1a1a1a" stroke="#AAAAAA" stroke-width="1"/>
  <text x="324" y="191" fill="#E0E0E0" font-size="11" text-anchor="middle" font-family="Arial">Courier</text>

  <!-- Left tech tags -->
  <text x="30" y="100" fill="#FFD700" font-size="12" font-family="Arial" font-weight="bold">Stack</text>
  <rect x="18" y="108" width="88" height="19" rx="3" fill="#1E1E1E" stroke="#FFD700" stroke-width="1"/>
  <text x="62" y="121" fill="#FFD700" font-size="10.5" text-anchor="middle" font-family="Arial">React Native</text>
  <rect x="18" y="133" width="88" height="19" rx="3" fill="#1E1E1E" stroke="#AAAAAA" stroke-width="1"/>
  <text x="62" y="146" fill="#E0E0E0" font-size="10.5" text-anchor="middle" font-family="Arial">Expo SDK</text>
  <rect x="18" y="158" width="88" height="19" rx="3" fill="#1E1E1E" stroke="#AAAAAA" stroke-width="1"/>
  <text x="62" y="171" fill="#E0E0E0" font-size="10.5" text-anchor="middle" font-family="Arial">JWT Auth</text>
  <rect x="18" y="183" width="88" height="19" rx="3" fill="#1E1E1E" stroke="#AAAAAA" stroke-width="1"/>
  <text x="62" y="196" fill="#E0E0E0" font-size="10.5" text-anchor="middle" font-family="Arial">Spring Boot</text>

  <!-- Right labels -->
  <text x="494" y="100" fill="#FFD700" font-size="12" font-family="Arial" font-weight="bold">Features</text>
  <text x="400" y="121" fill="#E0E0E0" font-size="10.5" font-family="Arial">&#x2713; Real-time order modals</text>
  <text x="400" y="141" fill="#E0E0E0" font-size="10.5" font-family="Arial">&#x2713; Dual-role session routing</text>
  <text x="400" y="161" fill="#E0E0E0" font-size="10.5" font-family="Arial">&#x2713; JWT token persistence</text>
  <text x="400" y="181" fill="#E0E0E0" font-size="10.5" font-family="Arial">&#x2713; SMS/Email opt-in</text>

  <!-- Project title footer -->
  <rect x="0" y="248" width="600" height="32" fill="#1E1E1E"/>
  <text x="300" y="269" fill="#FFD700" font-size="15" text-anchor="middle" font-family="Arial" font-weight="bold">Rocket Food Delivery — Mobile App</text>
