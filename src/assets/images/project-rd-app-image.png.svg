<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#0f172a" rx="12"/>
  <rect x="210" y="25" width="180" height="300" fill="#1e293b" rx="24" stroke="#38bdf8" stroke-width="2"/>
  <rect x="270" y="35" width="60" height="6" fill="#0f172a" rx="3"/>
  <!-- App Header -->
  <rect x="225" y="55" width="150" height="25" fill="#334155" rx="6"/>
  <text x="235" y="72" fill="#f8fafc" font-family="Arial" font-size="10" font-weight="bold">Rocket Food Delivery</text>
  <!-- Food Item Card -->
  <rect x="225" y="90" width="150" height="110" fill="#0f172a" rx="8"/>
  <circle cx="260" cy="125" r="20" fill="#ff6b6b"/>
  <rect x="290" y="110" width="70" height="8" fill="#cbd5e1" rx="2"/>
  <rect x="290" y="125" width="45" height="6" fill="#64748b" rx="2"/>
  <!-- Stepper Control -->
  <rect x="235" y="160" width="130" height="28" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="248" y="178" fill="#38bdf8" font-family="Arial" font-size="14" font-weight="bold">-</text>
  <text x="293" y="178" fill="#f8fafc" font-family="Arial" font-size="11" font-weight="bold">2</text>
  <text x="342" y="178" fill="#38bdf8" font-family="Arial" font-size="14" font-weight="bold">+</text>
  <!-- CTA Button -->
  <rect x="225" y="210" width="150" height="32" fill="#38bdf8" rx="8"/>
  <text x="255" y="230" fill="#0f172a" font-family="Arial" font-size="11" font-weight="bold">Confirm Order</text>
  <!-- Tech Badges -->
  <rect x="225" y="252" width="60" height="16" fill="#22c55e" fill-opacity="0.2" rx="4"/>
  <text x="233" y="264" fill="#4ade80" font-family="Arial" font-size="8">JWT Active</text>
  <rect x="290" y="252" width="85" height="16" fill="#38bdf8" fill-opacity="0.2" rx="4"/>
  <text x="296" y="264" fill="#38bdf8" font-family="Arial" font-size="8">Expo Router v55</text>
</svg>
