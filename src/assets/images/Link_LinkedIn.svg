  <circle cx="140" cy="75" r="10" fill="#1E1E1E" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="90" y1="118" x2="90" y2="145" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="98" y1="88" x2="132" y2="80" stroke="#AAAAAA" stroke-width="1"/>

  <circle cx="510" cy="100" r="18" fill="#1E1E1E" stroke="#FFD700" stroke-width="1.5"/>
