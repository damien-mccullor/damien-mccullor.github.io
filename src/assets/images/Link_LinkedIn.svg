  <text x="300" y="130" fill="#FFD700" font-size="72" font-weight="900" text-anchor="middle" font-family="Arial">in</text>

  <!-- Connection dots -->
  <circle cx="90" cy="100" r="18" fill="#1E1E1E" stroke="#FFD700" stroke-width="1.5"/>
