  <circle cx="460" cy="75" r="10" fill="#1E1E1E" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="510" y1="118" x2="510" y2="145" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="502" y1="88" x2="468" y2="80" stroke="#AAAAAA" stroke-width="1"/>

  <!-- Footer -->
